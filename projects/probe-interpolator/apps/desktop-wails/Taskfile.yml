version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  default:
    summary: 一键构建并启动（生产模式，使用内嵌前端资源）
    cmds:
      - task: build-frontend
      - task: build-go
      - task: run

  build:
    summary: 构建前端 + Go 二进制
    cmds:
      - task: build-frontend
      - task: build-go

  windows:build:
    summary: Wails v3 Windows 构建入口
    cmds:
      - task: build

  build-frontend:
    summary: 仅构建前端
    cmds:
      - cd frontend && npm install --no-audit --no-fund
      - cd frontend && npm run build

  generate-icon:
    summary: 从 appicon.png 重新生成 Windows icon.ico 与 wails_windows_amd64.syso 资源段
    description: |
      Wails v3 alpha.106 的 `wails3 generate build-assets` 把构建资源拆到 `windows/`、`linux/`、
      `darwin/` 等平台子目录（而非旧版的 `build/windows/`、`build/info.json`、`build/windows.manifest`）。
      本任务确保每次构建都从源 appicon.png 重新生成图标资源，并按 alpha.106 的实际输出路径
      调用 `wails3 generate syso`。
      若 `windows/info.json` 或 `windows/wails.exe.manifest` 缺失，则自动调用 wails3 generate build-assets 补齐。
      注意：必须使用 wails3 generate syso 覆盖 wails_windows_amd64.syso，
      不能用 rsrc 单独生成 rsrc.syso，否则会与 wails_windows_amd64.syso 中的 .rsrc 段冲突，
      触发链接错误 "too many .rsrc sections"。
    cmds:
      # 若 windows/info.json 或 windows/wails.exe.manifest 缺失，则补齐 build-assets
      - powershell -Command "if (-not (Test-Path windows/info.json) -or -not (Test-Path windows/wails.exe.manifest)) { wails3 generate build-assets }"
      # 由源 appicon.png 生成多尺寸 icon.ico（256/128/64/48/32/16）
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico
      # 将 icon.ico 打包为 Windows PE 资源段 syso 文件，go build 会自动链接
      - wails3 generate syso -arch amd64 -icon windows/icon.ico -info windows/info.json -manifest windows/wails.exe.manifest -out wails_windows_amd64.syso

  build-go:
    summary: 仅构建 Go 二进制（生产模式，含 -tags production 与 -trimpath/-w/-s）
    deps:
      - generate-icon
    env:
      GOWORK: off
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/probe-interpolator.exe .

  run:
    summary: 运行已构建的桌面应用
    cmds:
      - build/bin/probe-interpolator.exe

  run-dev:
    summary: 使用已构建的内嵌前端运行桌面应用
    cmds:
      - cmd /C "set FRONTEND_DEVSERVER_URL=&& build\bin\probe-interpolator.exe"

  dev:
    summary: 开发模式（构建前端后运行内嵌资源，未启用 production 标签以保留 devtools）
    deps:
      - generate-icon
    cmds:
      - task: build-frontend
      - go build -buildvcs=false -o build/bin/probe-interpolator.exe .
      - task: run-dev

  dev:frontend:
    summary: Wails 开发模式使用的 Vite 前端服务
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  clean:
    summary: 清理上次打包遗留的二进制和资源文件，避免与新构建混淆
    cmds:
      # Test-Path 守卫：build/bin 不存在时 Remove-Item 会返回 exit 1（嵌套 powershell
      # 对不存在的路径即使 -ErrorAction SilentlyContinue 也置 $?=False），
      # 导致 task clean 在无遗留产物时失败。加守卫后恒 exit 0。
      - cmd: powershell -NoProfile -Command "if (Test-Path build/bin) { Remove-Item -Recurse -Force build/bin }"

  check-bindings:
    summary: 检查 Wails backend 方法与 frontend bindings 是否一致（方法缺失/多余 + stale 时间戳警告）
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/check-wails-bindings.ps1 -Projects probe-interpolator

  archive-release:
    summary: 将 NSIS installer 拷贝到 projects/probe-interpolator/releases/bin/ 归档（按版本号命名，不入库 SVN）
    description: |
      读取 projects/probe-interpolator/VERSION，从 build/bin/ 中查找 probe-interpolator-<version>-amd64-installer.exe，
      拷贝到 projects/probe-interpolator/releases/bin/。
      前置条件：必须先执行 makensis build/windows/installer/project.nsi 生成 installer。
      releases/bin/ 已配置 svn:ignore，归档文件不入 SVN，仅本地保留。
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/copy-release-artifacts.ps1 -Project probe-interpolator

  release:
    summary: 生产交付构建（清理 + 前端 + Go 生产二进制 + 归档 installer）
    description: |
      完整的 release 流程：清理 -> 构建前端 -> 构建 Go 生产二进制。
      注意：NSIS installer 打包需手动执行 `makensis build/windows/installer/project.nsi`，
      然后执行 `task archive-release` 归档到 releases/bin/。
    cmds:
      - task: clean
      - task: build-frontend
      - task: build-go
