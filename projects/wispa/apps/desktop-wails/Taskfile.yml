version: '3'

# WISPA Taskfile：定义 wails3 dev / wails3 task 所用的构建与运行任务
# 策略与 wind-daq 一致：dev 模式不依赖 vite dev server，而是构建前端后内嵌到 Go 二进制
tasks:
  default:
    summary: 一键构建并启动（生产模式，使用内嵌前端资源）
    cmds:
      - task: build-frontend
      - task: build-go
      - task: run

  dev-frontend:
    summary: 启动前端开发服务器（热更新，独立调试前端时使用）
    cmds:
      - cd frontend && npm run dev -- --host 127.0.0.1
    env:
      BROWSER: none

  build:
    summary: 构建前端 + Go 二进制
    cmds:
      - task: build-frontend
      - task: build-go

  windows:build:
    summary: Wails v3 Windows 构建入口
    cmds:
      - task: build

  build-frontend:
    summary: 仅构建前端（npm install + npm run build，输出到 frontend/dist）
    cmds:
      - cd frontend && npm install --no-audit --no-fund
      - cd frontend && npm run build

  generate-icon:
    summary: 从 appicon.png 重新生成 Windows icon.ico 与 wails_windows_amd64.syso 资源段
    description: |
      Wails v3 的 wails3 build 不会自动重新生成 syso 资源段文件，
      导致修改 appicon.png 后 exe 图标不刷新（go build 会链接旧 syso）。
      本任务确保每次构建都从源 appicon.png 重新生成图标资源。
      使用 build/windows/info.json 和 build/windows/wails.exe.manifest 模板文件，
      wails3 generate syso 内部会用 wails.json 的 info 字段渲染模板，
      无需手动维护具体值版本的 info.json/manifest。
    cmds:
      # 确保 build/windows 目录存在；若模板文件缺失则补齐 build-assets
      - powershell -Command "New-Item -ItemType Directory -Force -Path build/windows | Out-Null; if (-not (Test-Path build/windows/info.json) -or -not (Test-Path build/windows/wails.exe.manifest)) { wails3 generate build-assets }"
      # 由源 appicon.png 生成多尺寸 icon.ico（256/128/64/48/32/16）
      - wails3 generate icons -input appicon.png -windowsfilename build/windows/icon.ico
      # 将 icon.ico 打包为 Windows PE 资源段 syso 文件，go build 会自动链接
      # 直接使用模板文件，wails3 generate syso 内部会渲染 Go template
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -info build/windows/info.json -manifest build/windows/wails.exe.manifest -out wails_windows_amd64.syso

  build-go:
    summary: 仅构建 Go 二进制（生产模式，含 -tags production 与 -trimpath/-w/-s）
    deps:
      - generate-icon
    env:
      # 隔离工作空间中其他模块的 wails/v2 间接引用，避免运行时 correct build tags 错误
      GOWORK: off
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/wispa.exe .

  run:
    summary: 运行已构建的桌面应用
    cmds:
      - build/bin/wispa.exe

  run-dev:
    summary: 使用已构建的内嵌前端运行桌面应用（清除 FRONTEND_DEVSERVER_URL 以使用内嵌资源）
    cmds:
      # 用 cmd /C 而非 powershell -Command "$env:..."：
      # task 在 Windows 上默认 shell 是 cmd.exe，传给 powershell 时 $env 会被吞掉，
      # 导致 PowerShell 收到 ":FRONTEND_DEVSERVER_URL=" 并报 CommandNotFoundException。
      # `set VAR=` 是 cmd 原生清空环境变量的写法，&& 串联下一条命令。
      - cmd /C "set FRONTEND_DEVSERVER_URL=&& build\bin\wispa.exe"

  dev:
    summary: 开发模式（构建前端后运行内嵌资源，未启用 production 标签以保留 devtools）
    deps:
      - generate-icon
    cmds:
      - task: build-frontend
      - go build -buildvcs=false -o build/bin/wispa.exe .
      - task: run-dev

  clean:
    summary: 清理上次打包遗留的二进制，避免与新构建混淆
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force build/bin -ErrorAction SilentlyContinue; exit 0"

  check-bindings:
    summary: 检查 Wails backend 方法与 frontend bindings 是否一致（方法缺失/多余 + stale 时间戳警告）
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/check-wails-bindings.ps1 -Projects wispa

  archive-release:
    summary: 将 NSIS installer 拷贝到 projects/wispa/releases/bin/ 归档（按版本号命名，不入库 SVN）
    description: |
      读取 projects/wispa/VERSION，从 build/bin/ 中查找 wispa-<version>-amd64-installer.exe，
      拷贝到 projects/wispa/releases/bin/。
      前置条件：必须先执行 makensis build/windows/installer/project.nsi 生成 installer。
      releases/bin/ 已配置 svn:ignore，归档文件不入 SVN，仅本地保留。
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/copy-release-artifacts.ps1 -Project wispa

  release:
    summary: 生产交付构建（清理 + 前端 + Go 生产二进制 + NSIS installer + 自动归档）
    description: |
      完整的 release 流程：清理 -> 构建前端 -> 构建 Go 生产二进制 ->
      自动生成 NSIS installer（makensis）-> 自动归档到 releases/bin/。
      前置条件：本地已安装 makensis，且 build/windows/installer/wails_tools.nsh 已由
      wails3 generate build-assets 生成（或此前构建过）。
      releases/bin/ 已配置 svn:ignore，归档文件不入 SVN，仅本地保留。
    cmds:
      - task: clean
      - task: build-frontend
      - task: build-go
      - cd build/windows/installer && makensis -DARG_WAILS_AMD64_BINARY=..\\..\\bin\\wispa.exe project.nsi
      - task: archive-release
