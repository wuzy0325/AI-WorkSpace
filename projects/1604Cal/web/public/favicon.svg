<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- gauge arc -->
  <path d="M130 370 A150 150 0 0 1 382 370" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
  <!-- tick marks along the arc: 5 major ticks -->
  <line x1="142" y1="280" x2="148" y2="292" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.50" transform="rotate(-60 256 310)"/>
  <line x1="142" y1="280" x2="148" y2="292" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.50" transform="rotate(-30 256 310)"/>
  <line x1="142" y1="280" x2="148" y2="292" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.90" transform="rotate(0 256 310)"/>
  <line x1="142" y1="280" x2="148" y2="292" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.50" transform="rotate(30 256 310)"/>
  <line x1="142" y1="280" x2="148" y2="292" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.50" transform="rotate(60 256 310)"/>
  <!-- gauge inner arc -->
  <path d="M156 370 A120 120 0 0 1 356 370" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.20"/>
  <!-- needle -->
  <line x1="256" y1="310" x2="330" y2="240" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="310" x2="220" y2="360" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.40"/>
  <!-- center dot -->
  <circle cx="256" cy="310" r="10" fill="#ffffff"/>
  <circle cx="256" cy="310" r="5" fill="#10b981"/>
  <!-- highlight reflection -->
  <ellipse cx="140" cy="120" rx="90" ry="50" fill="rgba(255,255,255,0.12)" transform="rotate(-30 140 120)"/>
</svg>
