version: '3'

# 引入公共任务与平台 Taskfile。Wails v3 约定：
# - build/Taskfile.yml 存放跨平台共享任务（前端构建/代码生成等），以 common: 命名空间暴露；
# - windows/Taskfile.yml 存放 Windows 专属构建/打包任务，以 windows: 命名空间暴露；
#   wails3 build / wails3 package 会查找 windows:build、windows:package 等任务。
# 这样根 Taskfile 与平台 Taskfile 都只 include build/Taskfile.yml，避免 root <-> windows 循环 include。
includes:
  common: ./build/Taskfile.yml
  windows: ./windows/Taskfile.yml

# 应用版本：构建时从 projects/windlabx4/VERSION 读取，注入 backend.buildVersion，
# 保证软件内显示的版本号与发布版本一致。
vars:
  APP_VERSION:
    sh: powershell -NoProfile -Command "(Get-Content ../../VERSION | Select-Object -First 1).Trim()"

tasks:
  # 以下任务供 `wails3 dev` 使用。`wails3 dev` 读取 ./build/config.yml 的
  # dev_mode.executes，其中依次执行 build-frontend(blocking)、build-go(blocking)、
  # run-dev(primary)。三个任务缺一不可，否则 dev 模式会报
  # "Task xxx does not exist" 并退出。
  build-frontend:
    summary: 仅构建前端（wails3 dev 使用）
    dir: frontend
    cmds:
      - npm install --no-audit --no-fund
      - npm run build

  build-go:
    summary: 仅构建 Go 二进制（生产模式，含 -tags production 与 -trimpath/-w/-s）
    # 图标资源段 wails_windows_amd64.syso 已在仓库中生成，dev 流程无需重新生成，
    # 因此不依赖 generate-icon，避免 Windows 上 icon 生成命令干扰 dev 启动。
    # GOWORK=off 防止 go.work 中的多模块干扰构建。
    env:
      GOWORK: off
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X windlabx4/apps/desktop-wails/backend.buildVersion={{.APP_VERSION}}" -o build/bin/windlabx4.exe .
      # 复制 DAQ-P-1603 DLL，未找到不阻止构建
      - powershell -ExecutionPolicy Bypass -File scripts/copy-dll.ps1

  run:
    summary: 运行已构建的桌面应用
    cmds:
      - build/bin/windlabx4.exe

  run-dev:
    summary: 使用已构建的内嵌前端运行桌面应用（wails3 dev 的 primary 进程）
    cmds:
      - cmd /C "set FRONTEND_DEVSERVER_URL=&& build\bin\windlabx4.exe"

  clean:
    summary: 清理上次打包遗留的二进制和资源文件，避免与新构建混淆
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force build/bin -ErrorAction SilentlyContinue; exit 0"

  generate-bindings:
    summary: 重新生成 Wails 前端 bindings
    description: |
      绑定 ID 是 FNV(模块路径.类型.方法名) 的哈希。任何影响该 FQN 的变更
      （Go 模块改名、方法增删）若不重新生成 bindings，前端 dist 会携带旧 ID
      调用新后端，触发 "unknown bound method id"。因此在每次构建前强制重新生成。
      注意：必须使用与 go.mod 中 wails/v3 runtime 同版本的全局 wails3 CLI。
    env:
      GOWORK: off
    cmds:
      - wails3 generate bindings -silent

  generate-icon:
    summary: 从 appicon.png 重新生成 Windows icon.ico 与 wails_windows_amd64.syso 资源段
    description: |
      wails3 build 不会自动重新生成 syso 资源段，导致修改 appicon.png 后 exe 图标不刷新。
      本任务确保从源 appicon.png 重新生成图标资源。
      注意：必须用 wails3 generate syso 覆盖 wails_windows_amd64.syso，
      不能用 rsrc 单独生成 rsrc.syso，否则与 wails_windows_amd64.syso 中的 .rsrc 段冲突。
    cmds:
      # Wails generate build-assets 会生成 appicon.png/windows/*，归一化到 build/
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path build/windows | Out-Null; if (-not (Test-Path -LiteralPath 'appicon.png') -or -not (Test-Path -LiteralPath 'windows/info.json') -or -not (Test-Path -LiteralPath 'windows/wails.exe.manifest')) { wails3 generate build-assets }; if (Test-Path -LiteralPath 'appicon.png') { Copy-Item -LiteralPath 'appicon.png' -Destination 'build/appicon.png' -Force }; if (Test-Path -LiteralPath 'windows/info.json') { Copy-Item -LiteralPath 'windows/info.json' -Destination 'build/windows/info.json' -Force }; if (Test-Path -LiteralPath 'windows/wails.exe.manifest') { Copy-Item -LiteralPath 'windows/wails.exe.manifest' -Destination 'build/windows/wails.exe.manifest' -Force }; if (-not (Test-Path -LiteralPath 'build/appicon.png') -or -not (Test-Path -LiteralPath 'build/windows/info.json') -or -not (Test-Path -LiteralPath 'build/windows/wails.exe.manifest')) { throw 'Wails build assets are missing after generation' }"
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -info build/windows/info.json -manifest build/windows/wails.exe.manifest -out wails_windows_amd64.syso

  release:
    summary: 生产交付构建（清理 + bindings + 图标 + 前端 + Go 生产二进制）
    description: |
      完整的 release 流程：清理 -> 重新生成 bindings -> 重新生成图标资源 -> 构建前端 -> 构建 Go 生产二进制。
      注意：NSIS installer 打包需手动执行 `makensis build/windows/installer/project.nsi`，
      然后执行 `task archive-release` 归档到 releases/bin/。
    cmds:
      - task: clean
      - task: generate-bindings
      - task: generate-icon
      - task: build-frontend
      - task: build-go

  archive-release:
    summary: 将 NSIS installer 拷贝到 projects/windlabx4/releases/bin/ 归档（按版本号命名，不入库 SVN）
    description: |
      读取 projects/windlabx4/VERSION，从 build/bin/ 中查找 WindLabX4-<version>-amd64-installer.exe，
      拷贝到 projects/windlabx4/releases/bin/。
      前置条件：必须先执行 makensis build/windows/installer/project.nsi 生成 installer。
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/copy-release-artifacts.ps1 -Project WindLabX4

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    desc: |
      Builds the application with the server build tag enabled.
      Server mode runs as a pure HTTP server without native GUI dependencies.
      Usage: task build:server
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - go build -tags server {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}
    vars:
      BUILD_FLAGS: "{{.BUILD_FLAGS}}"

  run:server:
    summary: Builds and runs the application in server mode
    deps:
      - task: build:server
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}

  build:docker:
    summary: Builds a Docker image for server mode deployment
    desc: |
      Creates a minimal Docker image containing the server mode binary.
      The image is based on distroless for security and small size.
      Usage: task build:docker [TAG=myapp:latest]
    cmds:
      - docker build -t {{.TAG | default (printf "%s:latest" .APP_NAME)}} -f build/docker/Dockerfile.server .
    vars:
      TAG: "{{.TAG}}"
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."
      - sh: test -f build/docker/Dockerfile.server
        msg: "Dockerfile.server not found. Run 'wails3 update build-assets' to generate it."

  run:docker:
    summary: Builds and runs the Docker image
    desc: |
      Builds the Docker image and runs it, exposing port 8080.
      Usage: task run:docker [TAG=myapp:latest] [PORT=8080]
      Note: The internal container port is always 8080. The PORT variable
      only changes the host port mapping. Ensure your app uses port 8080
      or modify the Dockerfile to match your ServerOptions.Port setting.
    deps:
      - task: build:docker
        vars:
          TAG:
            ref: .TAG
    cmds:
      - docker run --rm -p {{.PORT | default "8080"}}:8080 {{.TAG | default (printf "%s:latest" .APP_NAME)}}
    vars:
      TAG: "{{.TAG}}"
      PORT: "{{.PORT}}"

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    desc: |
      Builds the Docker image needed for cross-compiling to any platform.
      Run this once to enable cross-platform builds from any OS.
    cmds:
      - docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  ios:device:list:
    summary: Lists connected iOS devices (UDIDs)
    cmds:
      - xcrun xcdevice list

  ios:run:device:
    summary: Build, install, and launch on a physical iPhone using Apple tools (xcodebuild/devicectl)
    vars:
      PROJECT: '{{.PROJECT}}'   # e.g., build/ios/xcode/<YourProject>.xcodeproj
      SCHEME: '{{.SCHEME}}'     # e.g., ios.dev
      CONFIG: '{{.CONFIG | default "Debug"}}'
      DERIVED: '{{.DERIVED | default "build/ios/DerivedData"}}'
      UDID: '{{.UDID}}'         # from `task ios:device:list`
      BUNDLE_ID: '{{.BUNDLE_ID}}' # e.g., com.yourco.wails.ios.dev
      TEAM_ID: '{{.TEAM_ID}}'   # optional, if your project is not already set up for signing
    preconditions:
      - sh: xcrun -f xcodebuild
        msg: "xcodebuild not found. Please install Xcode."
      - sh: xcrun -f devicectl
        msg: "devicectl not found. Please update to Xcode 15+ (which includes devicectl)."
      - sh: test -n '{{.PROJECT}}'
        msg: "Set PROJECT to your .xcodeproj path (e.g., PROJECT=build/ios/xcode/App.xcodeproj)."
      - sh: test -n '{{.SCHEME}}'
        msg: "Set SCHEME to your app scheme (e.g., SCHEME=ios.dev)."
      - sh: test -n '{{.UDID}}'
        msg: "Set UDID to your device UDID (see: task ios:device:list)."
      - sh: test -n '{{.BUNDLE_ID}}'
        msg: "Set BUNDLE_ID to your app's bundle identifier (e.g., com.yourco.wails.ios.dev)."
    cmds:
      - |
        set -euo pipefail
        echo "Building for device: UDID={{.UDID}} SCHEME={{.SCHEME}} PROJECT={{.PROJECT}}"
        XCB_ARGS=(
          -project "{{.PROJECT}}"
          -scheme "{{.SCHEME}}"
          -configuration "{{.CONFIG}}"
          -destination "id={{.UDID}}"
          -derivedDataPath "{{.DERIVED}}"
          -allowProvisioningUpdates
          -allowProvisioningDeviceRegistration
        )
        # Optionally inject signing identifiers if provided
        if [ -n '{{.TEAM_ID}}' ]; then XCB_ARGS+=(DEVELOPMENT_TEAM={{.TEAM_ID}}); fi
        if [ -n '{{.BUNDLE_ID}}' ]; then XCB_ARGS+=(PRODUCT_BUNDLE_IDENTIFIER={{.BUNDLE_ID}}); fi
        xcodebuild "${XCB_ARGS[@]}" build | xcpretty || true
        # If xcpretty isn't installed, run without it
        if [ "${PIPESTATUS[0]}" -ne 0 ]; then
          xcodebuild "${XCB_ARGS[@]}" build
        fi
        # Find built .app
        APP_PATH=$(find "{{.DERIVED}}/Build/Products" -type d -name "*.app" -maxdepth 3 | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Could not locate built .app under {{.DERIVED}}/Build/Products" >&2
          exit 1
        fi
        echo "Installing: $APP_PATH"
        xcrun devicectl device install app --device "{{.UDID}}" "$APP_PATH"
        echo "Launching: {{.BUNDLE_ID}}"
        xcrun devicectl device process launch --device "{{.UDID}}" --stderr console --stdout console "{{.BUNDLE_ID}}"
