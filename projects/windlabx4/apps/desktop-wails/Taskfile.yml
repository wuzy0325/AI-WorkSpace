version: '3'

# 应用版本：构建时从 projects/windlabx4/VERSION 读取，注入后端 GetVersion 绑定
#（-X 链接到 backend.buildVersion），保证软件内显示的版本号与发布版本一致
#（历史硬编码 "1.0.0" 导致顶栏版本号永远不随版本 bump 更新）。
vars:
  APP_VERSION:
    sh: powershell -NoProfile -Command "(Get-Content ../../VERSION | Select-Object -First 1).Trim()"

tasks:
  default:
    summary: 一键构建并启动（生产模式，使用内嵌前端资源）
    cmds:
      - task: build-frontend
      - task: build-go
      - task: run

  dev-frontend:
    summary: 启动前端开发服务器（热更新）
    dir: frontend
    cmds:
      - npm run dev -- --host 127.0.0.1
    env:
      BROWSER: none

  generate-bindings:
    summary: 重新生成 Wails 前端 bindings
    description: |
      绑定 ID 是 FNV(模块路径.类型.方法名) 的哈希。任何影响该 FQN 的变更
      （Go 模块改名、方法增删）若不重新生成 bindings，前端 dist 会携带旧 ID
      调用新后端，触发 "unknown bound method id" 且 RequestExit 绑定失效导致
      窗口无法关闭。因此在每次构建前强制重新生成，保证前后端 ID 自洽。
      注意：必须使用与 go.mod 中 wails/v3 runtime 同版本的全局 wails3 CLI
      （不能用 go run，模块 go.sum 未包含 CLI 依赖）。
    env:
      GOWORK: off
    cmds:
      - wails3 generate bindings -silent

  build:
    summary: 构建前端 + Go 二进制
    cmds:
      - task: generate-bindings
      - task: build-frontend
      - task: build-go

  windows:build:
    summary: Wails v3 Windows 构建入口
    cmds:
      - task: build

  build-frontend:
    summary: 仅构建前端
    dir: frontend
    cmds:
      - npm install --no-audit --no-fund
      - npm run build

  generate-icon:
    summary: 从 appicon.png 重新生成 Windows icon.ico 与 wails_windows_amd64.syso 资源段
    description: |
      Wails v3 的 wails3 build 不会自动重新生成 syso 资源段文件，
      导致修改 appicon.png 后 exe 图标不刷新（go build 会链接旧 syso）。
      本任务确保每次构建都从源 appicon.png 重新生成图标资源。
      使用 build/windows/info.json 和 build/windows/wails.exe.manifest 模板文件，
      wails3 generate syso 内部会用 wails.json 的 info 字段渲染模板，
      无需手动维护具体值版本的 info.json/manifest。
      注意：必须使用 wails3 generate syso 覆盖 wails_windows_amd64.syso，
      不能用 rsrc 单独生成 rsrc.syso，否则会与 wails_windows_amd64.syso 中的 .rsrc 段冲突，
      触发链接错误 "too many .rsrc sections"。
    cmds:
      # 确保 build/windows 目录存在；若模板文件缺失则补齐 build-assets
      - powershell -Command "New-Item -ItemType Directory -Force -Path build/windows | Out-Null; if (-not (Test-Path build/windows/info.json) -or -not (Test-Path build/windows/wails.exe.manifest)) { wails3 generate build-assets }"
      # 由源 appicon.png 生成多尺寸 icon.ico（256/128/64/48/32/16）
      # WindLabX4 的 appicon.png 在 build/ 下（与其他项目根目录不同）
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico
      # 将 icon.ico 打包为 Windows PE 资源段 syso 文件，go build 会自动链接
      # 直接使用模板文件，wails3 generate syso 内部会渲染 Go template
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -info build/windows/info.json -manifest build/windows/wails.exe.manifest -out wails_windows_amd64.syso

  build-go:
    summary: 仅构建 Go 二进制（生产模式，含 -tags production 与 -trimpath/-w/-s）
    deps:
      - generate-icon
    env:
      GOWORK: off
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X windlabx4/apps/desktop-wails/backend.buildVersion={{.APP_VERSION}}" -o build/bin/windlabx4.exe .
      # 复制 DAQ-P-1603 DLL（优先 WindLabX，回退 ART），未找到不阻止构建。
      # 路径通过环境变量 WTNDAQ16H_DLL_PATHS 覆盖（分号分隔，按顺序尝试），
      # 默认值兼容现有开发环境。CI 可设 WTNDAQ16H_DLL_PATHS=D:\ci\libs\WTNDAQ16H_64.dll。
      # 抽到独立脚本文件，规避 wails3 task 在 Windows 上把 `$$` 替换成 PID 的解析 bug。
      - powershell -ExecutionPolicy Bypass -File scripts/copy-dll.ps1

  run:
    summary: 运行已构建的桌面应用
    cmds:
      - build/bin/windlabx4.exe

  run-dev:
    summary: 使用已构建的内嵌前端运行桌面应用
    cmds:
      - cmd /C "set FRONTEND_DEVSERVER_URL=&& build\bin\windlabx4.exe"

  dev:
    summary: 开发模式（重新生成 bindings + 构建前端后运行内嵌资源，未启用 production 标签以保留 devtools）
    deps:
      - generate-icon
    cmds:
      - task: generate-bindings
      - task: build-frontend
      - go build -buildvcs=false -o build/bin/windlabx4.exe .
      - task: run-dev

  clean:
    summary: 清理上次打包遗留的二进制和资源文件，避免与新构建混淆
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force build/bin -ErrorAction SilentlyContinue; exit 0"

  check-bindings:
    summary: 检查 Wails backend 方法与 frontend bindings 是否一致（方法缺失/多余 + stale 时间戳警告）
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/check-wails-bindings.ps1 -Projects WindLabX4

  archive-release:
    summary: 将 NSIS installer 拷贝到 projects/windlabx4/releases/bin/ 归档（按版本号命名，不入库 SVN）
    description: |
      读取 projects/windlabx4/VERSION，从 build/bin/ 中查找 WindLabX4-<version>-amd64-installer.exe，
      拷贝到 projects/windlabx4/releases/bin/。
      前置条件：必须先执行 makensis build/windows/installer/project.nsi 生成 installer。
      releases/bin/ 已配置 svn:ignore，归档文件不入 SVN，仅本地保留。
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/copy-release-artifacts.ps1 -Project WindLabX4

  release:
    summary: 生产交付构建（清理 + bindings + 前端 + Go 生产二进制 + 归档 installer）
    description: |
      完整的 release 流程：清理 -> 重新生成 bindings -> 构建前端 -> 构建 Go 生产二进制。
      注意：NSIS installer 打包需手动执行 `makensis build/windows/installer/project.nsi`，
      然后执行 `task archive-release` 归档到 releases/bin/。
    cmds:
      - task: clean
      - task: generate-bindings
      - task: build-frontend
      - task: build-go
