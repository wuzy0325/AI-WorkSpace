  <!-- 表格说明 -->
  <text x="60" y="500" font-size="16" fill="#94a3b8">说明：</text>
  <text x="60" y="524" font-size="15" fill="#475569">· 数值列右对齐 + tabular-nums，列宽统一 160rpx</text>
