version: '3'

tasks:
  default:
    summary: 一键构建并启动（生产模式，使用内嵌前端资源）
    cmds:
      - task: build-frontend
      - task: build-go
      - task: run

  dev-frontend:
    summary: 启动前端开发服务器（热更新）
    cmds:
      - npm --prefix frontend run dev -- --host 127.0.0.1
    env:
      BROWSER: none

  build:
    summary: 构建前端 + Go 二进制
    cmds:
      - task: build-frontend
      - task: build-go

  windows:build:
    summary: Wails v3 Windows 构建入口
    cmds:
      - task: build

  build-frontend:
    summary: 仅构建前端
    cmds:
      - npm --prefix frontend install --no-audit --no-fund
      - npm --prefix frontend run build

  generate-syso:
    summary: 生成 Windows .syso 资源文件（嵌入图标）
    cmds:
      - rsrc -ico build/windows/icon.ico -o rsrc.syso

  build-go:
    summary: 仅构建 Go 二进制（生产模式，含 -tags production 与 -trimpath/-w/-s）
    deps:
      - generate-syso
    env:
      GOWORK: off
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o build/bin/motion-controller.exe .
      - cmd: powershell "if (Test-Path rsrc.syso) { Remove-Item rsrc.syso }"

  run:
    summary: 运行已构建的桌面应用
    cmds:
      - build/bin/motion-controller.exe

  run-dev:
    summary: 使用已构建的内嵌前端运行桌面应用
    cmds:
      - cmd /C "set FRONTEND_DEVSERVER_URL=&& build\bin\motion-controller.exe"

  dev:
    summary: 开发模式（构建前端后运行内嵌资源，未启用 production 标签以保留 devtools）
    cmds:
      - task: build-frontend
      - task: generate-syso
      - go build -buildvcs=false -o build/bin/motion-controller.exe .
      - cmd: powershell "if (Test-Path rsrc.syso) { Remove-Item rsrc.syso }"
      - task: run-dev

  clean:
    summary: 清理上次打包遗留的二进制和资源文件，避免与新构建混淆
    cmds:
      - cmd: powershell Remove-Item -Recurse -Force build/bin -ErrorAction SilentlyContinue
      - cmd: powershell "if (Test-Path rsrc.syso) { Remove-Item rsrc.syso }"

  check-bindings:
    summary: 检查 Wails backend 方法与 frontend bindings 是否一致（方法缺失/多余 + stale 时间戳警告）
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/check-wails-bindings.ps1 -Projects motion-controller

  archive-release:
    summary: 将 NSIS installer 拷贝到 projects/motion-controller/releases/bin/ 归档（按版本号命名，不入库 SVN）
    description: |
      读取 projects/motion-controller/VERSION，从 build/bin/ 中查找 motion-controller-<version>-amd64-installer.exe，
      拷贝到 projects/motion-controller/releases/bin/。
      前置条件：必须先执行 makensis build/windows/installer/project.nsi 生成 installer。
      releases/bin/ 已配置 svn:ignore，归档文件不入 SVN，仅本地保留。
    cmds:
      - powershell -ExecutionPolicy Bypass -File ../../../../scripts/copy-release-artifacts.ps1 -Project motion-controller

  release:
    summary: 生产交付构建（清理 + 前端 + Go 生产二进制 + 归档 installer）
    description: |
      完整的 release 流程：清理 -> 构建前端 -> 构建 Go 生产二进制。
      注意：NSIS installer 打包需手动执行 `makensis build/windows/installer/project.nsi`，
      然后执行 `task archive-release` 归档到 releases/bin/。
    cmds:
      - task: clean
      - task: build-frontend
      - task: build-go
