openapi: "3.0.3"
info:
  title: Wind-DAQ API
  description: 风洞数据采集系统 REST API
  version: "0.1.0"
servers:
  - url: http://localhost:8080
    description: 本地开发服务器

paths:
  # ==================== 应用 ====================
  /api/app/version:
    get:
      tags: [应用]
      summary: 获取应用版本
      operationId: getVersion
      responses:
        "200":
          description: 版本信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "0.1.0-go"

  # ==================== 设备管理 ====================
  /api/device/profiles:
    get:
      tags: [设备管理]
      summary: 获取设备配置列表
      operationId: getDeviceProfiles
      responses:
        "200":
          description: 设备配置列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceProfile"
    put:
      tags: [设备管理]
      summary: 添加或更新设备配置
      operationId: upsertDeviceProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProfile"
      responses:
        "200":
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/device/profiles/{id}:
    delete:
      tags: [设备管理]
      summary: 删除设备配置
      operationId: deleteDeviceProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备ID
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          description: 删除失败

  /api/device/instances:
    get:
      tags: [设备管理]
      summary: 获取活跃设备实例
      operationId: getDeviceInstances
      responses:
        "200":
          description: 活跃设备实例列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceInstance"

  /api/device/status:
    get:
      tags: [设备管理]
      summary: 获取所有设备状态
      operationId: getAllDeviceStatus
      responses:
        "200":
          description: 设备状态列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceStatus"

  /api/device/capabilities:
    get:
      tags: [设备管理]
      summary: 获取支持的能力列表
      operationId: getDeviceCapabilities
      responses:
        "200":
          description: 支持的能力
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceTypes:
                    type: array
                    items:
                      type: string
                    example: ["SIMULATED", "DAQ-P-1604", "DAQ-T-1603", "WTN_PXI"]
                  transports:
                    type: array
                    items:
                      type: string
                    example: ["tcp", "serial"]

  /api/device/{id}/connect:
    post:
      tags: [设备管理]
      summary: 连接设备
      operationId: connectDevice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 连接成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/device/{id}/disconnect:
    post:
      tags: [设备管理]
      summary: 断开设备
      operationId: disconnectDevice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 断开成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/device/{id}/startAcquisition:
    post:
      tags: [设备管理]
      summary: 开始单设备采集
      operationId: startDeviceAcquisition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 采集启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/device/{id}/stopAcquisition:
    post:
      tags: [设备管理]
      summary: 停止单设备采集
      operationId: stopDeviceAcquisition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 采集停止成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/device/{id}/unit:
    put:
      tags: [设备管理]
      summary: 设置通道单位
      operationId: setDeviceUnit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unit:
                  type: string
                  description: 单位(V/mA/℃)
                  example: "V"
      responses:
        "200":
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/device/{id}/daqT1603Config:
    get:
      tags: [设备管理]
      summary: 获取DAQ-T1603配置
      operationId: getDaqT1603Config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: T1603配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaqT1603HardwareConfig"
    put:
      tags: [设备管理]
      summary: 应用DAQ-T1603配置
      operationId: applyDaqT1603Config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaqT1603HardwareConfig"
      responses:
        "200":
          description: 配置应用成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ==================== 设备扫描 ====================
  /api/scan/devices:
    post:
      tags: [设备扫描]
      summary: 扫描网络中的设备
      operationId: scanDevices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: 设备类型(all/DAQ-P-1604/DAQ-T-1603)
                  default: "all"
                timeout:
                  type: integer
                  description: 超时时间(毫秒)
                  default: 3000
      responses:
        "200":
          description: 发现的设备列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoveredDevice"

  # ==================== DAQ采集 ====================
  /api/daq/startAcquisition:
    post:
      tags: [DAQ采集]
      summary: 开始所有设备采集
      operationId: startAllAcquisition
      responses:
        "200":
          description: 采集启动结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/daq/stopAcquisition:
    post:
      tags: [DAQ采集]
      summary: 停止所有设备采集
      operationId: stopAllAcquisition
      responses:
        "200":
          description: 采集停止成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/daq/publishRate:
    get:
      tags: [DAQ采集]
      summary: 获取推送频率
      operationId: getPublishRate
      responses:
        "200":
          description: 当前推送频率(Hz)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hz:
                    type: number
                    format: float
                    example: 20.0
    put:
      tags: [DAQ采集]
      summary: 设置推送频率
      operationId: setPublishRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hz:
                  type: number
                  format: float
                  description: 推送频率(1-100 Hz)
                  example: 20.0
      responses:
        "200":
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ==================== 运动控制 ====================
  /api/motion/profiles:
    get:
      tags: [运动控制]
      summary: 获取控制器配置列表
      operationId: getMotionProfiles
      responses:
        "200":
          description: 控制器配置列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MotionControllerProfile"
    put:
      tags: [运动控制]
      summary: 添加或更新控制器配置
      operationId: upsertMotionProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MotionControllerProfile"
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/profiles/{id}:
    delete:
      tags: [运动控制]
      summary: 删除控制器配置
      operationId: deleteMotionProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/motion/status:
    get:
      tags: [运动控制]
      summary: 获取所有控制器状态
      operationId: getAllMotionStatus
      responses:
        "200":
          description: 控制器状态列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MotionControllerStatus"

  /api/motion/{id}/connect:
    post:
      tags: [运动控制]
      summary: 连接控制器
      operationId: connectMotion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 连接成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/disconnect:
    post:
      tags: [运动控制]
      summary: 断开控制器
      operationId: disconnectMotion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 断开成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/moveTo:
    post:
      tags: [运动控制]
      summary: 绝对位置运动
      operationId: motionMoveTo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                axis:
                  type: string
                  enum: [X, Y, Z, U]
                position:
                  type: number
                  format: float
      responses:
        "200":
          description: 运动指令已下发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/moveBy:
    post:
      tags: [运动控制]
      summary: 相对位置运动(增量)
      operationId: motionMoveBy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                axis:
                  type: string
                  enum: [X, Y, Z, U]
                delta:
                  type: number
                  format: float
      responses:
        "200":
          description: 运动指令已下发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/jog:
    post:
      tags: [运动控制]
      summary: 寸动(连续运动)
      operationId: motionJog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                axis:
                  type: string
                  enum: [X, Y, Z, U]
                direction:
                  type: string
                  enum: ["+", "-"]
                speed:
                  type: number
                  format: float
      responses:
        "200":
          description: 寸动指令已下发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/home:
    post:
      tags: [运动控制]
      summary: 回零(寻找原点)
      operationId: motionHome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                axis:
                  type: string
                  enum: [X, Y, Z, U]
      responses:
        "200":
          description: 回零指令已下发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/stop:
    post:
      tags: [运动控制]
      summary: 停止指定轴或所有轴
      operationId: motionStop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                axis:
                  type: string
                  enum: [X, Y, Z, U]
                  description: 留空则停止所有轴
      responses:
        "200":
          description: 停止成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/emergencyStop:
    post:
      tags: [运动控制]
      summary: 急停(所有轴)
      operationId: motionEmergencyStop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 急停已触发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/motion/{id}/definePosition:
    post:
      tags: [运动控制]
      summary: 定义当前位置(重新初始化)
      operationId: motionDefinePosition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                axis:
                  type: string
                  enum: [X, Y, Z, U]
                position:
                  type: number
                  format: float
      responses:
        "200":
          description: 位置已定义
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ==================== 校准 ====================
  /api/calibration/start:
    post:
      tags: [校准]
      summary: 开始自动校准
      operationId: startCalibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationConfig"
      responses:
        "200":
          description: 校准已启动
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  taskId:
                    type: string
  /api/calibration/pause:
    post:
      tags: [校准]
      summary: 暂停校准
      operationId: pauseCalibration
      responses:
        "200":
          description: 已暂停
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/calibration/resume:
    post:
      tags: [校准]
      summary: 恢复校准
      operationId: resumeCalibration
      responses:
        "200":
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/calibration/stop:
    post:
      tags: [校准]
      summary: 停止校准
      operationId: stopCalibration
      responses:
        "200":
          description: 已停止
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/calibration/status:
    get:
      tags: [校准]
      summary: 获取校准状态
      operationId: getCalibrationStatus
      responses:
        "200":
          description: 校准任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationTaskStatus"
  /api/calibration/config:
    get:
      tags: [校准]
      summary: 获取校准配置
      operationId: getCalibrationConfig
      responses:
        "200":
          description: 校准配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationConfig"
    put:
      tags: [校准]
      summary: 保存校准配置
      operationId: saveCalibrationConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationConfig"
      responses:
        "200":
          description: 配置已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ==================== 曲面扫描 ====================
  /api/traversal/start:
    post:
      tags: [曲面扫描]
      summary: 开始曲面扫描
      operationId: startTraversal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TraversalConfig"
      responses:
        "200":
          description: 扫描已启动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/traversal/pause:
    post:
      tags: [曲面扫描]
      summary: 暂停扫描
      operationId: pauseTraversal
      responses:
        "200":
          description: 已暂停
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/traversal/resume:
    post:
      tags: [曲面扫描]
      summary: 恢复扫描
      operationId: resumeTraversal
      responses:
        "200":
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/traversal/stop:
    post:
      tags: [曲面扫描]
      summary: 停止扫描
      operationId: stopTraversal
      responses:
        "200":
          description: 已停止
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/traversal/progress:
    get:
      tags: [曲面扫描]
      summary: 获取扫描进度
      operationId: getTraversalProgress
      responses:
        "200":
          description: 扫描进度
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraversalProgress"

  # ==================== 数据存储 ====================
  /api/storage/settings:
    get:
      tags: [数据存储]
      summary: 获取存储设置
      operationId: getStorageSettings
      responses:
        "200":
          description: 存储设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
    put:
      tags: [数据存储]
      summary: 更新存储设置
      operationId: updateStorageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageSettings"
      responses:
        "200":
          description: 设置已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/storage/status:
    get:
      tags: [数据存储]
      summary: 获取存储状态
      operationId: getStorageStatus
      responses:
        "200":
          description: 存储运行状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  isRecording:
                    type: boolean
                  fileCount:
                    type: integer
                  totalBytes:
                    type: integer
                    format: int64
  /api/storage/startRecording:
    post:
      tags: [数据存储]
      summary: 开始录制
      operationId: startRecording
      responses:
        "200":
          description: 录制已启动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/storage/stopRecording:
    post:
      tags: [数据存储]
      summary: 停止录制
      operationId: stopRecording
      responses:
        "200":
          description: 录制已停止
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/storage/pickDirectory:
    post:
      tags: [数据存储]
      summary: 获取数据存储目录
      operationId: pickStorageDirectory
      responses:
        "200":
          description: 存储目录路径
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string

  # ==================== 报告 ====================
  /api/report/calibration:
    post:
      tags: [报告]
      summary: 生成校准报告
      operationId: generateCalibrationReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calibType:
                  type: string
                  description: 校准类型
                config:
                  type: object
                results:
                  type: object
      responses:
        "200":
          description: 报告已生成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      filepath:
                        type: string
  /api/report/traversal:
    post:
      tags: [报告]
      summary: 生成曲面扫描报告
      operationId: generateTraversalReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                results:
                  type: object
      responses:
        "200":
          description: 报告已生成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      filepath:
                        type: string
  /api/report/generate:
    post:
      tags: [报告]
      summary: 生成通用报告
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportData"
      responses:
        "200":
          description: 报告已生成
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      filepath:
                        type: string

  # ==================== WebSocket ====================
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket 连接端点
      description: |
        升级 HTTP 连接为 WebSocket，用于实时数据推送。
        客户端连接后应发送订阅请求:
        ```json
        { "type": "subscribe", "channels": ["daq:data-snapshot"] }
        ```
      operationId: webSocketConnect
      responses:
        "101":
          description: 切换为 WebSocket 协议

components:
  schemas:
    # ---------- 通用 ----------
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        success:
          type: boolean
          example: false

    # ---------- 设备 ----------
    DeviceProfile:
      type: object
      properties:
        id:
          type: string
          description: 配置唯一ID
        name:
          type: string
          description: 配置名称
        type:
          $ref: "#/components/schemas/DeviceType"
        macAddress:
          type: string
        transport:
          $ref: "#/components/schemas/TransportType"
        address:
          type: string
          description: IP地址
        port:
          type: integer
        serialPort:
          type: string
        baudRate:
          type: integer
        samplingRate:
          type: integer
          description: 采样率(Hz)
        autoConnect:
          type: boolean
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelConfig"
        daqT1603Config:
          $ref: "#/components/schemas/DaqT1603HardwareConfig"
      required:
        - id
        - name
        - type

    DeviceType:
      type: string
      enum: [SIMULATED, DAQ-P-1604, DAQ-T-1603, WTN_PXI]

    TransportType:
      type: string
      enum: [tcp, serial]

    ChannelConfig:
      type: object
      properties:
        index:
          type: integer
        name:
          type: string
        enabled:
          type: boolean
        unit:
          type: string
        precision:
          type: integer
        rangeMin:
          type: number
          nullable: true
        rangeMax:
          type: number
          nullable: true
      required:
        - index
        - name
        - enabled

    DaqT1603HardwareConfig:
      type: object
      properties:
        thermocoupleTypes:
          type: array
          items:
            type: string
        channelMask:
          type: string
        samplingRate:
          type: integer
        binaryFormat:
          type: boolean
        averageCount:
          type: integer
        triggerMode:
          type: integer
        triggerEdge:
          type: integer
        triggerCount:
          type: integer
        openCircuitCheck:
          type: string

    DeviceStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/DeviceType"
        connection:
          type: string
          enum: [Disconnected, Connecting, Connected, Error]
        acquiring:
          type: boolean
        samplingRate:
          type: integer
        lastError:
          type: string

    DeviceInstance:
      type: object
      properties:
        profileId:
          type: string
        status:
          type: string
        acquiring:
          type: boolean
        lastError:
          type: string

    DiscoveredDevice:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
          description: IP地址
        port:
          type: integer
        type:
          type: string
        name:
          type: string
        macAddress:
          type: string
        serialNumber:
          type: string
        firmwareVersion:
          type: string
        model:
          type: string
        subnetMask:
          type: string
        gateway:
          type: string
        ipMode:
          type: string
        tcpConnected:
          type: boolean
        ipAssigned:
          type: boolean

    # ---------- 运动控制 ----------
    MotionControllerProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [SIMULATED-MC, B140-MC, WTNMC4A-MC]
        address:
          type: string
        port:
          type: integer
        autoConnect:
          type: boolean
        axes:
          type: array
          items:
            $ref: "#/components/schemas/AxisConfig"
      required:
        - id
        - name
        - type
        - axes

    AxisConfig:
      type: object
      properties:
        name:
          type: string
          enum: [X, Y, Z, U]
        enabled:
          type: boolean
        kind:
          type: string
          enum: [LINEAR, ROTARY]
        stepsPerRev:
          type: number
          nullable: true
        microSteps:
          type: number
          nullable: true
        lead:
          type: number
          nullable: true
        gearRatio:
          type: number
          nullable: true
        maxSpeed:
          type: number
          nullable: true
        minLimit:
          type: number
          nullable: true
        maxLimit:
          type: number
          nullable: true
        inverted:
          type: boolean
        encoderInverted:
          type: boolean
        positionSource:
          type: string
          enum: [register, encoder]
        encoderScale:
          type: number
          nullable: true
        encoderCompensation:
          $ref: "#/components/schemas/AxisEncoderCompensationConfig"
      required:
        - name
        - enabled
        - kind

    AxisEncoderCompensationConfig:
      type: object
      properties:
        enabled:
          type: boolean
        tolerance:
          type: number
          nullable: true
        maxCycles:
          type: integer
          nullable: true
        settleMs:
          type: number
          nullable: true
        minStep:
          type: number
          nullable: true
        timeoutMs:
          type: number
          nullable: true
      required:
        - enabled

    MotionControllerStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        connected:
          type: boolean
        axes:
          type: array
          items:
            $ref: "#/components/schemas/AxisStatus"
        lastError:
          type: string

    AxisStatus:
      type: object
      properties:
        name:
          type: string
          enum: [X, Y, Z, U]
        position:
          type: number
        moving:
          type: boolean
        homed:
          type: boolean
        posLimit:
          type: boolean
        negLimit:
          type: boolean
        compensating:
          type: boolean
        compensationError:
          type: string
        positionError:
          type: number
          nullable: true
      required:
        - name
        - position
        - moving
        - homed

    # ---------- 校准 ----------
    CalibrationConfig:
      type: object
      properties:
        type:
          type: string
          enum: [five-hole, three-hole, total-pressure, total-temperature]
        name:
          type: string
        probeChannels:
          type: array
          items:
            $ref: "#/components/schemas/ProbeChannelConfig"
        motionAxes:
          type: array
          items:
            $ref: "#/components/schemas/MotionAxisConfig"
        points:
          type: array
          items:
            $ref: "#/components/schemas/CalibrationPoint"
        dwellTimeMs:
          type: integer
        samplesPerPoint:
          type: integer
        savePath:
          type: string
        stopOnError:
          type: boolean
        sphereTankGate:
          $ref: "#/components/schemas/SphereTankGateConfig"
      required:
        - type
        - name
        - probeChannels
        - motionAxes
        - points
        - dwellTimeMs
        - samplesPerPoint
        - savePath

    ProbeChannelConfig:
      type: object
      properties:
        deviceId:
          type: string
        channel:
          type: integer
        role:
          type: string
        name:
          type: string
        enabled:
          type: boolean
      required:
        - deviceId
        - channel
        - role
        - name

    MotionAxisConfig:
      type: object
      properties:
        controllerId:
          type: string
        axis:
          type: string
          enum: [X, Y, Z, U]
      required:
        - controllerId
        - axis

    CalibrationPoint:
      type: object
      properties:
        index:
          type: integer
        x:
          type: number
        y:
          type: number
        z:
          type: number
        alpha:
          type: number
          description: 攻角(°)
        beta:
          type: number
          description: 侧滑角(°)
        acquired:
          type: boolean
      required:
        - index
        - acquired

    SphereTankGateConfig:
      type: object
      properties:
        enabled:
          type: boolean
        waitTimeSec:
          type: number
          format: float
        stableTimeDeviceId:
          type: string
        stableTimeChannel:
          type: integer
      required:
        - enabled
        - waitTimeSec

    CalibrationTaskStatus:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
          enum: [idle, configuring, running, paused, completed, error]
        currentPoint:
          type: integer
        completedPoints:
          type: integer
        totalPoints:
          type: integer
        startTime:
          type: string
          format: date-time
        lastError:
          type: string

    # ---------- 曲面扫描 ----------
    TraversalConfig:
      type: object
      properties:
        name:
          type: string
        controllerId:
          type: string
        axis:
          type: string
          enum: [X, Y, Z, U]
        startPos:
          type: number
        endPos:
          type: number
        stepSize:
          type: number
        dwellTimeMs:
          type: integer
        samplesPerPoint:
          type: integer
        deviceIds:
          type: array
          items:
            type: string
      required:
        - name
        - controllerId
        - axis
        - startPos
        - endPos
        - stepSize
        - dwellTimeMs
        - samplesPerPoint
        - deviceIds

    TraversalProgress:
      type: object
      properties:
        currentPos:
          type: number
        currentStep:
          type: integer
        totalSteps:
          type: integer
        status:
          type: string
          enum: [idle, running, paused, completed, error]

    # ---------- 存储 ----------
    StorageSettings:
      type: object
      properties:
        outputDir:
          type: string
        filePrefix:
          type: string
        autoSave:
          type: boolean
        format:
          type: string
          enum: [csv, tsv]
        maxFileSize:
          type: integer
          format: int64

    # ---------- 报告 ----------
    ReportData:
      type: object
      properties:
        type:
          type: string
          enum: [calibration, traversal, data-summary]
        title:
          type: string
        generated:
          type: string
          format: date-time
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReportSection"
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - type
        - title
        - sections

    ReportSection:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
          description: Markdown 格式内容
      required:
        - title
        - content

  # ---------- WebSocket 事件 Schemas ----------
    DataPayload:
      type: object
      properties:
        deviceId:
          type: string
        timestamp:
          type: integer
          description: 时间戳(毫秒)
        channels:
          type: array
          items:
            type: number
        channelIndices:
          type: array
          items:
            type: integer

    CalibrationProgressEvent:
      type: object
      properties:
        taskId:
          type: string
        currentPoint:
          type: integer
        completedPoints:
          type: integer
        totalPoints:
          type: integer
        latestData:
          type: object
        timestamp:
          type: string
          format: date-time

    CalibrationCompleteEvent:
      type: object
      properties:
        taskId:
          type: string
        success:
          type: boolean
        filePath:
          type: string
        error:
          type: string
        duration:
          type: number
        totalPoints:
          type: integer
        successPoints:
          type: integer
        timestamp:
          type: string
          format: date-time

    CalibrationRealtimeEvent:
      type: object
      properties:
        taskId:
          type: string
        type:
          type: string
          enum: [data, moving, waiting]
        point:
          $ref: "#/components/schemas/CalibrationPoint"
        data:
          type: object
        timestamp:
          type: string
          format: date-time
