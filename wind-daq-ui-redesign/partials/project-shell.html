<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* ==========================================================================
   Wind-DAQ UI Redesign — Brand Design Tokens
   Instrument-grade industrial DAQ application
   Tone: industrial/utilitarian, calm, data-dense
   ========================================================================== */

/* --- Brand Prefix --- */
:root {
  /* ── Primary Color ── */
  --brand-primary: #2563EB;
  --brand-primary-light: #3B82F6;
  --brand-primary-dark: #1D4ED8;
  --brand-primary-muted: rgba(37, 99, 235, 0.12);

  /* ── Surface Colors ── */
  --bg-canvas: #F8F9FB;
  --bg-panel: #FFFFFF;
  --bg-panel-strong: #F1F3F6;
  --bg-elevated: #FFFFFF;

  /* ── Text Colors ── */
  --text-primary: #111827;
  --text-secondary: #4B5563;
  --text-muted: #9CA3AF;
  --text-inverse: #FFFFFF;

  /* ── Border Colors ── */
  --border-default: #E5E7EB;
  --border-strong: #D1D5DB;
  --border-subtle: #F3F4F6;

  /* ── State Colors ── */
  --state-success: #059669;
  --state-success-bg: rgba(5, 150, 105, 0.08);
  --state-warning: #D97706;
  --state-warning-bg: rgba(217, 119, 6, 0.08);
  --state-error: #DC2626;
  --state-error-bg: rgba(220, 38, 38, 0.08);
  --state-info: #2563EB;
  --state-info-bg: rgba(37, 99, 235, 0.08);

  /* ── Channel Colors (DAQ telemetry) ── */
  --channel-1: #10B981;
  --channel-2: #3B82F6;
  --channel-3: #8B5CF6;
  --channel-4: #F59E0B;
  --channel-5: #EC4899;
  --channel-6: #14B8A6;
  --channel-7: #F97316;
  --channel-8: #6366F1;

  /* ── Radius Scale ── */
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  /* ── Spacing Scale ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Density Tokens (config panels) ── */
  --density-field-inline: 2px;
  --density-field-gap: 8px;
  --density-group-padding: 8px 12px;
  --density-group-gap: 10px;
  --density-section-gap: 12px;
  --density-group-title-gap: 4px;
  --density-control-height: 28px;
  --density-control-pad-x: 8px;

  /* ── Typography ── */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.08);

  /* ── Motion ── */
  --duration-fast: 120ms;
  --duration-normal: 200ms;
  --duration-slow: 350ms;
  --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- Dark Theme ── */
[data-theme='dark'] {
  --bg-canvas: #0F1117;
  --bg-panel: #1A1D27;
  --bg-panel-strong: #242836;
  --bg-elevated: #1E2230;

  --text-primary: #F3F4F6;
  --text-secondary: #9CA3AF;
  --text-muted: #6B7280;

  --border-default: #2D3348;
  --border-strong: #3D4460;
  --border-subtle: #1E2230;

  --state-success-bg: rgba(5, 150, 105, 0.15);
  --state-warning-bg: rgba(217, 119, 6, 0.15);
  --state-error-bg: rgba(220, 38, 38, 0.15);
  --state-info-bg: rgba(37, 99, 235, 0.15);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.2);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.35);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--brand-primary);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="font-sans" style="background:var(--bg-canvas);color:var(--text-primary);margin:0;overflow:hidden;height:100vh;font-family:var(--font-sans);font-size:var(--text-base)">

  <!-- ===== App Frame (Desktop Fixed) ===== -->
  <div class="flex h-screen w-screen overflow-hidden">

    <!-- Left Rail Nav (64px) -->
    <aside class="flex flex-col items-center w-16 shrink-0 border-r" style="background:var(--bg-panel);border-color:var(--border-default)">
      <!-- App Logo -->
      <div class="flex items-center justify-center w-16 h-14 shrink-0 border-b" style="border-color:var(--border-default)">
        <div class="w-7 h-7 rounded-md flex items-center justify-center text-white font-bold text-xs" style="background:var(--brand-primary)">W</div>
      </div>
      <!-- Nav Items -->
      <nav class="flex flex-col items-center gap-1 pt-3 flex-1">
        <!-- SLOT: rail-nav-items — leaf pages inject active states here -->
        <a class="rail-nav-item group" data-nav-key="dashboard" href="#">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="rail-nav-item group" data-nav-key="traversal" href="#">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
        </a>
        <a class="rail-nav-item group" data-nav-key="calibration" href="#">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20V10M6 20V4M18 20v-6"/></svg>
        </a>
        <a class="rail-nav-item group" data-nav-key="motion" href="#">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a class="rail-nav-item group" data-nav-key="log" href="#">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        </a>
      </nav>
      <!-- Footer -->
      <div class="flex flex-col items-center gap-2 pb-3 pt-2 border-t w-full" style="border-color:var(--border-default)">
        <a class="rail-nav-item group" data-nav-key="settings" href="#" title="全局设置">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex flex-col flex-1 min-w-0">

      <!-- Top Bar (56px) -->
      <header class="flex items-center justify-between shrink-0 px-5 border-b" style="height:56px;background:var(--bg-panel);border-color:var(--border-default)">
        <div class="flex items-center gap-3 min-w-0">
          <!-- SLOT: page-title -->
          <h1 class="text-base font-semibold truncate" style="color:var(--text-primary)">Wind-DAQ</h1>
          <span class="text-xs font-medium px-2 py-0.5 rounded-full" style="background:var(--state-success-bg);color:var(--state-success)">已连接</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition-colors" style="background:var(--brand-primary);color:white" data-dom-id="btn-connect">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            开始采集
          </button>
          <button class="p-1.5 rounded-md transition-colors hover:bg-gray-100" style="color:var(--text-secondary)" title="设备管理">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
        </div>
      </header>

      <!-- Content Stage -->
      <!-- SLOT: main-content — leaf pages fill this region -->
      <main class="flex-1 min-h-0 overflow-auto" style="background:var(--bg-canvas)">
        <!-- Main content region -->
      </main>

      <!-- Bottom Status Bar (72px) -->
      <footer class="flex items-center shrink-0 px-5 border-t" style="height:72px;background:var(--bg-panel);border-color:var(--border-default)">
        <div class="flex items-center gap-6 flex-1 min-w-0">
          <!-- Acquisition Status -->
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full" style="background:var(--state-success)"></div>
            <span class="text-xs" style="color:var(--text-secondary)">采集中</span>
            <span class="text-xs font-mono tabular-nums" style="color:var(--text-primary)">00:12:34</span>
          </div>
          <!-- Device Count -->
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5" style="color:var(--text-muted)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span class="text-xs" style="color:var(--text-secondary)">设备 <strong style="color:var(--text-primary)">2</strong>/4</span>
          </div>
          <!-- Sample Rate -->
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5" style="color:var(--text-muted)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12h4l3-9 4 18 3-9h4"/></svg>
            <span class="text-xs font-mono tabular-nums" style="color:var(--text-primary)">100 Hz</span>
          </div>
          <!-- Recording Status -->
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full" style="background:var(--state-error);animation:pulse 2s infinite"></div>
            <span class="text-xs" style="color:var(--text-secondary)">录制中</span>
            <span class="text-xs font-mono" style="color:var(--text-muted)">run-20260630-112340.csv</span>
          </div>
        </div>
        <!-- Theme Toggle -->
        <div class="flex items-center gap-2 ml-4 pl-4 border-l" style="border-color:var(--border-default)">
          <span class="text-xs" style="color:var(--text-muted)">v0.2.0</span>
        </div>
      </footer>

    </div>
  </div>

  <!-- Rail Nav Active State Styles -->
  <style>
    .rail-nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      transition: all var(--duration-fast) var(--ease-default);
      text-decoration: none;
      position: relative;
    }
    .rail-nav-item:hover {
      background: var(--bg-panel-strong);
      color: var(--text-secondary);
    }
    .rail-nav-item[data-active="true"] {
      background: var(--brand-primary-muted);
      color: var(--brand-primary);
    }
    .rail-nav-item[data-active="true"]::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: var(--brand-primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>

</body>
</html>
