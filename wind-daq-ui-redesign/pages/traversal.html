    <style id="theme-vars">
/* ==========================================================================
   Wind-DAQ UI Redesign — Brand Design Tokens
   Instrument-grade industrial DAQ application
   Tone: industrial/utilitarian, calm, data-dense
   ========================================================================== */

/* --- Brand Prefix --- */
:root {
  /* ── Primary Color ── */
  --brand-primary: #2563EB;
  --brand-primary-light: #3B82F6;
  --brand-primary-dark: #1D4ED8;
  --brand-primary-muted: rgba(37, 99, 235, 0.12);

  /* ── Surface Colors ── */
  --bg-canvas: #F8F9FB;
  --bg-panel: #FFFFFF;
  --bg-panel-strong: #F1F3F6;
  --bg-elevated: #FFFFFF;

  /* ── Text Colors ── */
  --text-primary: #111827;
  --text-secondary: #4B5563;
  --text-muted: #9CA3AF;
  --text-inverse: #FFFFFF;

  /* ── Border Colors ── */
  --border-default: #E5E7EB;
  --border-strong: #D1D5DB;
  --border-subtle: #F3F4F6;

  /* ── State Colors ── */
  --state-success: #059669;
  --state-success-bg: rgba(5, 150, 105, 0.08);
  --state-warning: #D97706;
  --state-warning-bg: rgba(217, 119, 6, 0.08);
  --state-error: #DC2626;
  --state-error-bg: rgba(220, 38, 38, 0.08);
  --state-info: #2563EB;
  --state-info-bg: rgba(37, 99, 235, 0.08);

  /* ── Channel Colors (DAQ telemetry) ── */
  --channel-1: #10B981;
  --channel-2: #3B82F6;
  --channel-3: #8B5CF6;
  --channel-4: #F59E0B;
  --channel-5: #EC4899;
  --channel-6: #14B8A6;
  --channel-7: #F97316;
  --channel-8: #6366F1;

  /* ── Radius Scale ── */
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  /* ── Spacing Scale ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Density Tokens (config panels) ── */
  --density-field-inline: 2px;
  --density-field-gap: 8px;
  --density-group-padding: 8px 12px;
  --density-group-gap: 10px;
  --density-section-gap: 12px;
  --density-group-title-gap: 4px;
  --density-control-height: 28px;
  --density-control-pad-x: 8px;

  /* ── Typography ── */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.08);

  /* ── Motion ── */
  --duration-fast: 120ms;
  --duration-normal: 200ms;
  --duration-slow: 350ms;
  --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- Dark Theme ── */
[data-theme='dark'] {
  --bg-canvas: #0F1117;
  --bg-panel: #1A1D27;
  --bg-panel-strong: #242836;
  --bg-elevated: #1E2230;

  --text-primary: #F3F4F6;
  --text-secondary: #9CA3AF;
  --text-muted: #6B7280;

  --border-default: #2D3348;
  --border-strong: #3D4460;
  --border-subtle: #1E2230;

  --state-success-bg: rgba(5, 150, 105, 0.15);
  --state-warning-bg: rgba(217, 119, 6, 0.15);
  --state-error-bg: rgba(220, 38, 38, 0.15);
  --state-info-bg: rgba(37, 99, 235, 0.15);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.2);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.35);
}

<body style="margin:0; padding:0; background:#1a1a2e; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; overflow:auto; font-family:var(--font-sans); font-size:var(--text-base); color:var(--text-primary);">

<!-- Desktop Window Frame: 1600x900 -->
<div style="width:1600px; height:900px; display:flex; flex-direction:column; overflow:hidden; border-radius:8px; box-shadow:0 25px 80px rgba(0,0,0,0.4); background:var(--bg-canvas); position:relative;">

  <!-- Custom Title Bar (32px) - mimics Wails/Electron window chrome -->

    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:14px; height:14px; border-radius:3px; background:var(--brand-primary); display:flex; align-items:center; justify-content:center;">
        <span style="color:white; font-size:9px; font-weight:700;">W</span>
      </div>
      <span style="font-size:12px; font-weight:600; color:var(--text-primary);">Wind-DAQ</span>
      <span style="font-size:10px; color:var(--text-muted); margin-left:4px;">v0.2.0</span>
    </div>
    <!-- Window traffic lights (decorative) -->
    <div style="margin-left:auto; display:flex; gap:6px; padding-right:12px;">

      <div style="width:10px; height:10px; border-radius:50%; background:#FEBC2E;"></div>
      <div style="width:10px; height:10px; border-radius:50%; background:#28C840;"></div>
    </div>
  </div>

  <!-- App Body (868px = 900 - 32) -->

    <!-- Left Rail Nav (48px, compact icon rail) -->

      <!-- Nav Items - compact, icon-only, 36px hit targets -->
      <nav style="display:flex; flex-direction:column; align-items:center; gap:2px; padding-top:8px; flex:1;">
        <a class="rail-nav" data-nav-key="dashboard" data-dom-id="nav-dashboard" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="traversal" data-active="true" data-dom-id="nav-traversal" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20V10M6 20V4M18 20v-6"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="motion" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="log" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        </a>
      </nav>
      <!-- Bottom settings -->
      <div style="padding-bottom:8px;">
        <a class="rail-nav" data-nav-key="settings" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </a>
      </div>
    </div>

    <!-- Right Content Area (1552px = 1600 - 48) -->
    <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">

      <!-- Top Toolbar (40px, compact) -->
      <div style="height:40px; display:flex; align-items:center; padding:0 12px; background:var(--bg-panel); border-bottom:1px solid var(--border-default); flex-shrink:0; gap:8px;">
        <span style="font-size:13px; font-weight:600; color:var(--text-primary);">移位测试</span>
        <span style="font-size:10px; font-weight:500; padding:1px 6px; border-radius:10px; background:var(--state-success-bg); color:var(--state-success);">已连接</span>
        <div style="flex:1;"></div>
        <!-- Right actions -->
        <div style="display:flex; align-items:center; gap:4px;">
          <span style="font-size:11px; color:var(--text-muted); font-family:var(--font-mono);">WTN1605-01</span>
          <button data-dom-id="btn-connect" style="height:26px; padding:0 10px; display:flex; align-items:center; gap:4px; border:none; border-radius:4px; background:var(--brand-primary); color:white; font-size:11px; font-weight:500; cursor:pointer;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            采集
          </button>
          <button style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:4px; background:transparent; color:var(--text-secondary); cursor:pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
        </div>
      </div>

      <!-- Main Content Stage -->
      <main style="flex:1; overflow:hidden; background:var(--bg-canvas); display:flex; flex-direction:column;">

        <!-- 顶部状态条 (36px) -->
        <div style="height:36px; display:flex; align-items:center; padding:0 12px; background:var(--bg-panel); border-bottom:1px solid var(--border-default); flex-shrink:0; gap:12px;">
          <!-- 左侧：状态信息 -->
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:6px; height:6px; border-radius:50%; background:var(--state-success);"></div>
            <span style="font-size:12px; color:var(--text-secondary); font-weight:500;">准备就绪</span>
            <span style="font-size:11px; color:var(--text-muted);">·</span>
            <span style="font-size:12px; color:var(--text-primary); font-family:var(--font-mono); font-weight:500;">PRB-5H-2024.cal</span>
            <span style="font-size:11px; color:var(--text-muted);">·</span>
            <span style="font-size:12px; color:var(--text-secondary);">144 点位</span>
          </div>
          <div style="flex:1;"></div>
          <!-- 右侧：操作按钮 -->
          <div style="display:flex; align-items:center; gap:6px;">
            <button style="height:26px; padding:0 12px; display:flex; align-items:center; gap:4px; border:none; border-radius:4px; background:var(--brand-primary); color:white; font-size:11px; font-weight:600; cursor:pointer;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              开始测试
            </button>
            <button style="width:26px; height:26px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border-default); border-radius:4px; background:var(--bg-panel); color:var(--text-secondary); cursor:pointer;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
          </div>
        </div>

        <!-- 主内容区：左数据面板 + 右可视化区 -->
        <div style="flex:1; display:flex; overflow:hidden;">

          <!-- ===== 左侧数据面板 (280px) ===== -->
          <div style="width:280px; display:flex; flex-direction:column; border-right:1px solid var(--border-default); overflow-y:auto; flex-shrink:0; background:var(--bg-panel);">

            <!-- 当前点位区 -->
            <div style="padding:10px 12px 8px 12px; border-bottom:1px solid var(--border-subtle);">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <span style="font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">当前点位</span>
                <span style="font-size:10px; color:var(--text-muted); font-family:var(--font-mono);">23 / 144</span>
              </div>
              <div style="display:flex; gap:12px; margin-top:6px;">
                <div style="display:flex; align-items:center; gap:3px;">
                  <span style="font-size:11px; color:var(--text-muted);">α =</span>
                  <span style="font-size:13px; color:var(--text-primary); font-family:var(--font-mono); font-weight:600; font-variant-numeric:tabular-nums;">0.0°</span>
                </div>
                <div style="display:flex; align-items:center; gap:3px;">
                  <span style="font-size:11px; color:var(--text-muted);">β =</span>
                  <span style="font-size:13px; color:var(--text-primary); font-family:var(--font-mono); font-weight:600; font-variant-numeric:tabular-nums;">0.0°</span>

              </div>
            </div>

            <!-- 插值结果区 -->
            <div style="padding:10px 12px; border-bottom:1px solid var(--border-subtle);">
              <span style="font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">插值结果</span>

              <!-- Mach 大字突出 -->
              <div style="margin-top:6px; display:flex; align-items:baseline; gap:4px;">
                <span style="font-size:11px; color:var(--text-muted); font-weight:500;">Mach</span>
                <span style="font-size:20px; font-family:var(--font-mono); font-weight:700; color:var(--channel-2); font-variant-numeric:tabular-nums; line-height:1;">0.82</span>
              </div>

              <!-- 其余参数 2 列网格 -->
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-top:8px;">
                <div style="display:flex; align-items:center; gap:4px;">
                  <div style="width:2px; height:14px; border-radius:1px; background:var(--channel-1);"></div>
                  <span style="font-size:11px; color:var(--text-muted);">P0</span>
                  <span style="font-size:14px; font-family:var(--font-mono); font-weight:600; color:var(--text-primary); font-variant-numeric:tabular-nums;">101325</span>
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  <div style="width:2px; height:14px; border-radius:1px; background:var(--channel-2);"></div>
                  <span style="font-size:11px; color:var(--text-muted);">Ps</span>
                  <span style="font-size:14px; font-family:var(--font-mono); font-weight:600; color:var(--text-primary); font-variant-numeric:tabular-nums;">94512</span>
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  <div style="width:2px; height:14px; border-radius:1px; background:var(--channel-3);"></div>
                  <span style="font-size:11px; color:var(--text-muted);">α</span>
                  <span style="font-size:14px; font-family:var(--font-mono); font-weight:600; color:var(--text-primary); font-variant-numeric:tabular-nums;">0.00°</span>
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  <div style="width:2px; height:14px; border-radius:1px; background:var(--channel-4);"></div>
                  <span style="font-size:11px; color:var(--text-muted);">β</span>
                  <span style="font-size:14px; font-family:var(--font-mono); font-weight:600; color:var(--text-primary); font-variant-numeric:tabular-nums;">0.00°</span>
                </div>
              </div>
            </div>

            <!-- 原始压力区 -->
            <div style="padding:10px 12px; flex:1;">
              <span style="font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">原始压力 (Pa)</span>
              <div style="margin-top:6px; display:flex; flex-direction:column; gap:0;">

                <!-- P1 -->
                <div style="height:20px; display:flex; align-items:center; gap:6px;">
                  <div style="width:2px; height:14px; border-radius:1px; background:var(--channel-1); flex-shrink:0;"></div>
                  <span style="font-size:11px; color:var(--text-muted); width:22px; flex-shrink:0; font-family:var(--font-mono);">P1</span>
                  <span style="font-size:13px; font-family:var(--font-mono); font-weight:500; color:var(--text-primary); font-variant-numeric:tabular-nums;">96842.3</span>
                </div>
                <!-- P2 -->
                <div style="height:20px; display:flex; align-items:center; gap:6px;">
                  <div style="width:2px; height:14px; border-radius:1px; background:var(--channel-2); flex-shrink:0;"></div>
                  <span style="font-size:11px; color:var(--text-muted); width:22px; flex-shrink:0; font-family:var(--font-mono);">P2</span>
                  <span style="font-size:13px; font-family:var(--font-mono); font-weight:500; color:var(--text-primary); font-variant-numeric:tabular-nums;">95127.8</span>
