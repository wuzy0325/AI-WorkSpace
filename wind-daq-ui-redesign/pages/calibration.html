<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校准工作台</title>
    <style id="theme-vars">
/* ==========================================================================
   Wind-DAQ UI Redesign — Brand Design Tokens
   Instrument-grade industrial DAQ application
   Tone: industrial/utilitarian, calm, data-dense
   ========================================================================== */

/* --- Brand Prefix --- */
:root {
  /* ── Primary Color ── */
  --brand-primary: #2563EB;
  --brand-primary-light: #3B82F6;
  --brand-primary-dark: #1D4ED8;
  --brand-primary-muted: rgba(37, 99, 235, 0.12);

  /* ── Surface Colors ── */
  --bg-canvas: #F8F9FB;
  --bg-panel: #FFFFFF;
  --bg-panel-strong: #F1F3F6;
  --bg-elevated: #FFFFFF;

  /* ── Text Colors ── */
  --text-primary: #111827;
  --text-secondary: #4B5563;
  --text-muted: #9CA3AF;
  --text-inverse: #FFFFFF;

  /* ── Border Colors ── */
  --border-default: #E5E7EB;
  --border-strong: #D1D5DB;
  --border-subtle: #F3F4F6;

  /* ── State Colors ── */
  --state-success: #059669;
  --state-success-bg: rgba(5, 150, 105, 0.08);
  --state-warning: #D97706;
  --state-warning-bg: rgba(217, 119, 6, 0.08);
  --state-error: #DC2626;
  --state-error-bg: rgba(220, 38, 38, 0.08);
  --state-info: #2563EB;
  --state-info-bg: rgba(37, 99, 235, 0.08);

  /* ── Channel Colors (DAQ telemetry) ── */
  --channel-1: #10B981;
  --channel-2: #3B82F6;
  --channel-3: #8B5CF6;
  --channel-4: #F59E0B;
  --channel-5: #EC4899;
  --channel-6: #14B8A6;
  --channel-7: #F97316;
  --channel-8: #6366F1;

  /* ── Radius Scale ── */
  --radius-sm: 2px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-full: 9999px;

  /* ── Spacing Scale ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* ── Density Tokens (config panels) ── */
  --density-field-inline: 2px;
  --density-field-gap: 8px;
  --density-group-padding: 8px 12px;
  --density-group-gap: 10px;
  --density-section-gap: 12px;
  --density-group-title-gap: 4px;
  --density-control-height: 28px;
  --density-control-pad-x: 8px;

  /* ── Typography ── */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, monospace;

  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;

  --leading-tight: 1.25;
  --leading-normal: 1.5;

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.08);

  /* ── Motion ── */
  --duration-fast: 120ms;
  --duration-normal: 200ms;
  --duration-slow: 350ms;
  --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- Dark Theme ── */
[data-theme='dark'] {
  --bg-canvas: #0F1117;
  --bg-panel: #1A1D27;
  --bg-panel-strong: #242836;
  --bg-elevated: #1E2230;

  --text-primary: #F3F4F6;
  --text-secondary: #9CA3AF;
  --text-muted: #6B7280;

  --border-default: #2D3348;
  --border-strong: #3D4460;
  --border-subtle: #1E2230;

  --state-success-bg: rgba(5, 150, 105, 0.15);
  --state-warning-bg: rgba(217, 119, 6, 0.15);
  --state-error-bg: rgba(220, 38, 38, 0.15);
  --state-info-bg: rgba(37, 99, 235, 0.15);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.2);
  --shadow-float: 0 12px 24px rgba(0, 0, 0, 0.35);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--brand-primary);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body style="margin:0; padding:0; background:#1a1a2e; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; overflow:auto; font-family:var(--font-sans); font-size:var(--text-base); color:var(--text-primary);">

<!-- Desktop Window Frame: 1600x900 -->
<div style="width:1600px; height:900px; display:flex; flex-direction:column; overflow:hidden; border-radius:8px; box-shadow:0 25px 80px rgba(0,0,0,0.4); background:var(--bg-canvas); position:relative;">

  <!-- Custom Title Bar (32px) -->
  <div style="height:32px; display:flex; align-items:center; padding-left:12px; background:var(--bg-panel); border-bottom:1px solid var(--border-default); flex-shrink:0; -webkit-app-region:drag;">
    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:14px; height:14px; border-radius:3px; background:var(--brand-primary); display:flex; align-items:center; justify-content:center;">
        <span style="color:white; font-size:9px; font-weight:700;">W</span>
      </div>
      <span style="font-size:12px; font-weight:600; color:var(--text-primary);">Wind-DAQ</span>
      <span style="font-size:10px; color:var(--text-muted); margin-left:4px;">v0.2.0</span>
    </div>
    <div style="margin-left:auto; display:flex; gap:6px; padding-right:12px;">
      <div style="width:10px; height:10px; border-radius:50%; background:#FF5F57;"></div>
      <div style="width:10px; height:10px; border-radius:50%; background:#FEBC2E;"></div>
      <div style="width:10px; height:10px; border-radius:50%; background:#28C840;"></div>
    </div>
  </div>

  <!-- App Body (868px = 900 - 32) -->
  <div style="flex:1; display:flex; overflow:hidden;">

    <!-- Left Rail Nav (48px) -->
    <div style="width:48px; display:flex; flex-direction:column; align-items:center; background:var(--bg-panel); border-right:1px solid var(--border-default); flex-shrink:0;">
      <nav style="display:flex; flex-direction:column; align-items:center; gap:2px; padding-top:8px; flex:1;">
        <a class="rail-nav" data-nav-key="dashboard" data-dom-id="nav-dashboard" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="traversal" data-dom-id="nav-traversal" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="calibration" data-dom-id="nav-calibration" data-active="true" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20V10M6 20V4M18 20v-6"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="motion" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a class="rail-nav" data-nav-key="log" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        </a>
      </nav>
      <div style="padding-bottom:8px;">
        <a class="rail-nav" data-nav-key="settings" href="#" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted); text-decoration:none; transition:all 120ms;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </a>
      </div>
    </div>

    <!-- Right Content Area (1552px) -->
    <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">

      <!-- Top Toolbar (40px) -->
      <div style="height:40px; display:flex; align-items:center; padding:0 12px; background:var(--bg-panel); border-bottom:1px solid var(--border-default); flex-shrink:0; gap:8px;">
        <span style="font-size:13px; font-weight:600; color:var(--text-primary);">校准工作台</span>
        <span style="font-size:10px; font-weight:500; padding:1px 6px; border-radius:10px; background:var(--state-info-bg); color:var(--state-info);">就绪</span>
        <div style="flex:1;"></div>
        <div style="display:flex; align-items:center; gap:4px;">
          <span style="font-size:11px; color:var(--text-muted); font-family:var(--font-mono);">WTN1605-01</span>
          <button data-dom-id="btn-start-calibration" style="height:26px; padding:0 10px; display:flex; align-items:center; gap:4px; border:none; border-radius:4px; background:var(--brand-primary); color:white; font-size:11px; font-weight:500; cursor:pointer;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            开始校准
          </button>
          <button style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:4px; background:transparent; color:var(--text-secondary); cursor:pointer;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
        </div>
      </div>

      <!-- Main Content Stage (796px = 868 - 40 - 32) -->
      <main style="flex:1; overflow:hidden; background:var(--bg-canvas); display:flex; flex-direction:column;">

        <!-- Tab Bar (32px) -->
        <div style="height:32px; display:flex; align-items:stretch; background:var(--bg-panel); border-bottom:1px solid var(--border-default); flex-shrink:0; padding:0 12px;">
          <button data-tab="five-hole" data-dom-id="tab-five-hole" style="height:32px; padding:0 14px; border:none; background:transparent; font-size:12px; font-weight:500; color:var(--brand-primary); border-bottom:2px solid var(--brand-primary); cursor:pointer; font-family:var(--font-sans);">五孔探针</button>
          <button data-tab="three-hole" data-dom-id="tab-three-hole" style="height:32px; padding:0 14px; border:none; background:transparent; font-size:12px; font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent; cursor:pointer; font-family:var(--font-sans);">三孔探针</button>
          <button data-tab="total-pressure" data-dom-id="tab-total-pressure" style="height:32px; padding:0 14px; border:none; background:transparent; font-size:12px; font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent; cursor:pointer; font-family:var(--font-sans);">总压</button>
          <button data-tab="total-temp" data-dom-id="tab-total-temp" style="height:32px; padding:0 14px; border:none; background:transparent; font-size:12px; font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent; cursor:pointer; font-family:var(--font-sans);">总温</button>
        </div>

        <!-- Content: Settings Panel + Chart Area -->
        <div style="flex:1; display:flex; overflow:hidden;">

          <!-- Left Settings Panel (240px) -->
          <div style="width:240px; flex-shrink:0; background:var(--bg-panel); border-right:1px solid var(--border-default); overflow-y:auto; padding:var(--density-section-gap); display:flex; flex-direction:column; gap:var(--density-section-gap);">

            <!-- Group: 角度范围 -->
            <div style="padding:var(--density-group-padding); border:1px solid var(--border-default); border-radius:var(--radius-md);">
              <div style="font-size:var(--text-xs); font-weight:var(--weight-bold); color:var(--text-primary); margin-bottom:var(--density-group-title-gap); text-transform:uppercase; letter-spacing:0.5px;">角度范围</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--density-field-gap);">
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">Min &#945; (&deg;)</label>
                  <input type="number" value="-180" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">Max &#945; (&deg;)</label>
                  <input type="number" value="180" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
              </div>
              <div style="margin-top:var(--density-field-gap);">
                <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">Step (&deg;)</label>
                <input type="number" value="5" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
              </div>
            </div>

            <!-- Group: 速度范围 -->
            <div style="padding:var(--density-group-padding); border:1px solid var(--border-default); border-radius:var(--radius-md);">
              <div style="font-size:var(--text-xs); font-weight:var(--weight-bold); color:var(--text-primary); margin-bottom:var(--density-group-title-gap); text-transform:uppercase; letter-spacing:0.5px;">速度范围</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--density-field-gap);">
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">Min V (m/s)</label>
                  <input type="number" value="5" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">Max V (m/s)</label>
                  <input type="number" value="60" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
              </div>
            </div>

            <!-- Group: 采集设置 -->
            <div style="padding:var(--density-group-padding); border:1px solid var(--border-default); border-radius:var(--radius-md);">
              <div style="font-size:var(--text-xs); font-weight:var(--weight-bold); color:var(--text-primary); margin-bottom:var(--density-group-title-gap); text-transform:uppercase; letter-spacing:0.5px;">采集设置</div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--density-field-gap);">
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">采样率 (Hz)</label>
                  <input type="number" value="100" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">平均次数</label>
                  <input type="number" value="1000" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
              </div>
              <div style="margin-top:var(--density-field-gap);">
                <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">稳定判据 (%)</label>
                <input type="number" value="0.5" step="0.1" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 6px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
              </div>
            </div>

            <!-- Group: 校准系数 -->
            <div style="padding:var(--density-group-padding); border:1px solid var(--border-default); border-radius:var(--radius-md);">
              <div style="font-size:var(--text-xs); font-weight:var(--weight-bold); color:var(--text-primary); margin-bottom:var(--density-group-title-gap); text-transform:uppercase; letter-spacing:0.5px;">校准系数</div>
              <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--density-field-gap);">
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">A1</label>
                  <input type="text" value="0.0324" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 4px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">A2</label>
                  <input type="text" value="-0.0012" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 4px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
                <div>
                  <label style="font-size:var(--text-xs); color:var(--text-secondary); display:block; margin-bottom:2px;">A3</label>
                  <input type="text" value="0.0008" style="width:100%; height:24px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-panel); font-size:var(--text-xs); padding:0 4px; font-family:var(--font-mono); box-sizing:border-box; color:var(--text-primary);">
                </div>
                <div>
